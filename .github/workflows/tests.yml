name: tests

on:
  push:
    branches:
      - main
      - Workbench
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    name: Python 3.12 tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v10
        with:
          version: "0.12.19"

      - name: Check dependency lock
        run: uv lock --check

      - name: Install locked development dependencies
        run: uv sync --locked --dev --python 3.12

      - name: Run tests
        run: uv run --no-sync python -m pytest -q

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Run existing UI tests
        run: node --test tests/demo_ui.test.cjs
